.header-brand-3d{position:absolute;left:50%;transform:translateX(-50%);display:inline-flex;align-items:baseline;gap:5px;color:#272522;font-family:"Space Grotesk",sans-serif;font-size:15px;font-weight:700;letter-spacing:-.08em;text-shadow:1px 1px 0 #d8d2c8,2px 2px 0 #bbb3a8,3px 3px 7px #221a1229}.header-brand-3d b{color:var(--orange);font-size:8px;letter-spacing:.17em;text-shadow:1px 1px 0 #d78c60,2px 2px 4px #221a1824}@media(max-width:720px){.header-brand-3d{display:inline-flex}.top{position:relative;justify-content:space-between}.crumb{display:none}.top-actions{margin-left:auto}}.update-button{display:inline-flex;align-items:center;gap:7px;min-height:34px;padding:0 12px;border:1px solid var(--line);border-radius:10px;color:#706a63;background:#fff;font-size:10px;font-weight:800;letter-spacing:.05em}.update-button:hover{color:var(--deep);border-color:#f5c4a8;background:var(--soft)}.update-nav-button{display:flex;align-items:center;justify-content:center;gap:7px;border-radius:15px;color:#9a938b;background:transparent;font-size:11px;font-weight:800}.update-nav-button:hover{color:var(--deep);background:var(--soft)}.update-overlay{position:fixed;z-index:100;top:50%;left:50%;display:flex;flex-direction:column;align-items:center;gap:14px;min-width:245px;padding:24px 28px;border:1px solid #ffffffcc;border-radius:20px;color:var(--ink);background:#fffffff0;box-shadow:0 24px 80px #23191033;backdrop-filter:blur(18px);text-align:center;transform:translate(-50%,-50%)}.update-overlay strong{font-size:11px;letter-spacing:.12em}.is-loading strong{color:var(--deep)}.is-success strong{color:var(--green)}.update-orb{display:grid;width:48px;height:48px;place-items:center;border-radius:15px;color:#fff;background:var(--orange);font-size:25px;box-shadow:0 10px 25px #f36b213f}.is-success .update-orb{background:var(--green)}.update-spin{animation:updateSpin .72s linear infinite}@keyframes updateSpin{to{transform:rotate(360deg)}}</style>

<body>
<div id="app"></div>
<script>
const keyUsers='vetmaq-single-users-v3',keyMachines='vetmaq-single-machines-v2',keySession='vetmaq-single-session';
const usersDefault=[
  // Administração
  {password:'17451020',role:'Administrador'},
  {password:'VetmaqAdmin02!',role:'Administrador'},
  {password:'VetmaqGestao03!',role:'Administrador'},
  {password:'VetmaqFinanceiro04!',role:'Operador'},
  {password:'VetmaqDiretoria05!',role:'Operador'},
  {password:'VetmaqMatriz06!',role:'Operador'},
  {password:'VetmaqFilial07!',role:'Operador'},
  {password:'VetmaqFilial08!',role:'Operador'},
  // Vendas
  {password:'vetmaq',role:'Vendedor'},
  {password:'VetmaqVendas10!',role:'Operador'},
  {password:'VetmaqVendas11!',role:'Operador'},
  {password:'VetmaqVendas12!',role:'Operador'},
  {password:'VetmaqVendas13!',role:'Operador'},
  {password:'VetmaqVendas14!',role:'Operador'},
  {password:'VetmaqVendas15!',role:'Operador'},
  {password:'VetmaqVendas16!',role:'Operador'},
  // Operação
  {password:'VetmaqOperador17!',role:'Operador'},
  {password:'VetmaqOperador18!',role:'Operador'},
  {password:'VetmaqOperador19!',role:'Operador'},
  {password:'VetmaqOperador20!',role:'Operador'},
  {password:'VetmaqOperador21!',role:'Operador'},
  {password:'VetmaqOperador22!',role:'Operador'},
  {password:'VetmaqOperador23!',role:'Operador'},
  {password:'VetmaqOperador24!',role:'Operador'},
  // Supervisão
  {password:'VetmaqSupervisor25!',role:'Operador'},
  {password:'VetmaqSupervisor26!',role:'Operador'},
  {password:'VetmaqSupervisor27!',role:'Operador'},
  {password:'VetmaqSupervisor28!',role:'Operador'},
  {password:'VetmaqSupervisor29!',role:'Operador'},
  {password:'VetmaqSupervisor30!',role:'Operador'},
  {password:'VetmaqSupervisor31!',role:'Operador'},
  {password:'VetmaqSupervisor32!',role:'Operador'}
];
const machinesDefault=[];
const get=(key,def)=>{try{return JSON.parse(localStorage.getItem(key))||def}catch{return def}},save=(key,val)=>localStorage.setItem(key,JSON.stringify(val)),brl=n=>Number(n).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}),esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
let users=get(keyUsers,usersDefault),machines=get(keyMachines,machinesDefault),session=null,view='overview',modal=null,editing=null,search='';
const icon=n=>({grid:'▦',box:'□',users:'♙',settings:'⚙',help:'?',logout:'↗',plus:'+',arrow:'→',download:'↓',pencil:'✎',trash:'×',search:'⌕',key:'⌑',lock:'▣',eye:'◉',x:'×',bolt:'✦'}[n]||'•');
function logo(){return `<div class="brand"><div class="mark"><span>V</span><i></i></div><div><b>VETMAQ</b><small>CONTROL</small></div></div>`}
function orb(){return `<div class="orb"><div class="halo"></div><div class="shadow"></div><div class="machine"><div class="machine-top"></div><div class="machine-body"><span></span><b></b></div><div class="handle"></div><div class="bar"></div><div class="wheel w1"></div><div class="wheel w2"></div></div></div>`}
function login(){document.getElementById('app').innerHTML=`<main class="login"><section class="login-art"><div class="grid"></div><div class="topline">${logo()}<span class="eyebrow">GESTÃO INTELIGENTE</span></div><div class="copy"><p class="eyebrow orange">CONTROLE O QUE IMPORTA</p><h1>Suas vendas.<br><em>Sob controle.</em></h1><p class="lede">A central operacional para transformar máquinas vendidas em decisões rápidas, precisas e rentáveis.</p></div>${orb()}<div class="foot"><span><i class="dot"></i> Operação segura</span><span>V. 2.6.0</span></div></section><section class="auth"><div class="auth-inner"><div class="mobile-brand">${logo()}</div><div><span class="kicker">${icon('lock')} ÁREA RESTRITA</span><h2>Acesso autorizado.</h2><p>Digite uma senha cadastrada para entrar no controle.</p></div><form class="form" id="loginForm"><label>Senha de acesso<div class="password"><input autofocus id="password" type="password" placeholder="Digite sua senha autorizada"><button type="button" onclick="togglePass('password',this)">${icon('eye')}</button></div></label><button class="primary full">Acessar painel ${icon('arrow')}</button></form><div class="meta"><span>${icon('lock')} Apenas senhas autorizadas entram</span><button type="button" onclick="alert('Fale com o administrador do VetMaq Control para cadastrar ou redefinir uma senha autorizada.')">Preciso de acesso</button></div><div class="demo"><i class="dot"></i><div><b>Ambiente protegido</b><small>As senhas autorizadas são administradas pelo responsável.</small></div></div></div></section></main>`;document.getElementById('loginForm').onsubmit=e=>{e.preventDefault();const u=users.find(x=>x.password===password.value);if(!u){password.value='';return alert('Senha não autorizada. O campo foi limpo para uma nova tentativa.')}session=u;render()}}
function togglePass(id,btn){const el=document.getElementById(id);el.type=el.type==='password'?'text':'password';btn.textContent=icon(el.type==='password'?'eye':'lock')}
function nav(){return `<aside class="side" id="side"><div class="side-top">${logo()}<button class="close" onclick="document.getElementById('side').classList.remove('open')">×</button></div><div class="workspace"><div class="avatar">${esc(session.role[0])}</div><div><strong>${esc(session.name)}</strong><small>${esc(session.role)}</small></div>⌄</div><nav class="nav"><button class="${view==='overview'?'active':''}" onclick="go('overview')">${icon('grid')}<span>Visão geral</span></button><button class="${view==='machines'?'active':''}" onclick="go('machines')">${icon('box')}<span>Máquinas</span><b>${machines.length}</b></button></nav><div class="label">SISTEMA</div><nav class="nav"><button onclick="toast('Preferências em breve.')">${icon('settings')}<span>Preferências</span></button><button onclick="toast('Central de ajuda em breve.')">${icon('help')}<span>Central de ajuda</span></button></nav><div class="bottom"><div class="online"><i class="dot"></i><div><strong>Sistema online</strong><small>Sincronizado agora</small></div></div><button class="logout" onclick="logout()">${icon('logout')} Sair da conta</button></div></aside>`}
function shell(content,title='Visão geral'){document.getElementById('app').innerHTML=`<div class="app">${nav()}<main class="main"><header class="top"><div class="header-brand-3d"><span>VETMAQ</span><b>CONTROL</b></div><div class="crumb"><span>Painel</span> → <strong>${title}</strong></div><div class="top-actions"></div></header><div class="content">${content}</div></main></div><nav class="mobile-bottom-nav"><button class="${view==='overview'?'active':''}" onclick="go('overview')">${icon('grid')}<span>Início</span></button><button class="${view==='machines'?'active':''}" onclick="go('machines')">${icon('box')}<span>Máquinas</span></button><button class="update-nav-button" onclick="updateApp()">↻<span>Atualizar</span></button></nav><div id="toast"></div>`}
function stats(){let total=machines.reduce((a,m)=>a+m.quantity*m.price,0),units=machines.reduce((a,m)=>a+m.quantity,0),commission=total*.007;return `<section class="stats"><div class="stat"><div class="stat-head">Total Vendido </div><strong>${brl(total)}</strong><small>↗ +12,8% este mês</small></div><div class="stat dark"><div class="stat-head">Máquinas Vendidas</div><strong>${String(units).padStart(2,'0')}</strong><small>${machines.length} modelos ativos</small></div><div class="stat cream"><div class="stat-head">Comissão 0,7%</div><strong>${brl(commission)}</strong><small>Sobre tudo vendido</small></div></section>`}
function overview(){let total=machines.reduce((a,m)=>a+m.quantity*m.price,0),units=machines.reduce((a,m)=>a+m.quantity,0),hour=new Date().getHours(),greeting=hour<12?'Bom dia':hour<18?'Boa tarde':'Boa noite';shell(`<section class="heading"><div><p class="eyebrow orange">SÁBADO, 12 DE SETEMBRO DE 2026</p><h1>${greeting}, <em>${esc(session.role)}.</em></h1><p class="support">Aqui está o pulso da sua operação hoje.</p></div><div class="actions"><button class="secondary" onclick="exportCSV()">↓ CSV</button><button class="secondary" onclick="exportPDF()">▣ PDF</button><button class="primary" onclick="openMachine()">+ Nova máquina</button></div></section><section class="hero"><div class="hero-copy"><p class="eyebrow orange">RESUMO DO DIA</p><h2>Venda visíveis.<br><span>Cálculos imediato.</span></h2><p>Você tem <strong>${units} unidades</strong> mapeadas em <strong>${machines.length} modelos</strong>. Seu inventário está avaliado em <strong>${brl(total)}</strong>.</p><button class="link" onclick="go('machines')">Explorar inventário →</button></div>${orb()}</section>${stats()}<section class="panel-grid"><div class="panel"><div class="panel-head"><div><p class="eyebrow">ATIVIDADE RECENTE</p><h3>Mix de máquinas</h3></div><button class="link" onclick="go('machines')">Ver tudo →</button></div><div class="mini-bars">${machines.slice(0,5).map(m=>`<div><div class="mini-label"><span>${esc(m.name.split(' ')[0])}</span><b>${m.quantity}</b></div><div class="bar"><i style="width:${Math.min(100,m.quantity*7+10)}%"></i></div></div>`).join('')}</div></div><div class="panel quick"><div class="panel-head"><div><p class="eyebrow">ATALHO RÁPIDO</p><h3>O que você precisa?</h3></div><b style="color:var(--orange)"></b></div><div class="quick-list"><button onclick="openMachine()"><span>+ Adicionar máquina</span>→</button><button onclick="exportCSV()"><span>↓ Salvar Relatório relatório</span>→</button></div></div></section>`,'Visão geral')}
function machinesPage(){let total=machines.reduce((a,m)=>a+m.quantity*m.price,0),list=machines.filter(m=>(m.name+' '+m.category).toLowerCase().includes(search.toLowerCase()));shell(`<section class="heading"><div><p class="eyebrow orange">INVENTÁRIO</p><h1>Máquinas</h1><p class="support">Gerencie seu mix, disponibilidade e valor de venda.</p></div><div class="actions"><button class="secondary" onclick="exportCSV()">↓ CSV</button><button class="secondary" onclick="exportPDF()">▣ PDF</button><button class="primary" onclick="openMachine()">+ Nova máquina</button></div></section><section class="panel machines-panel"><div class="toolbar"><div class="search">⌕<input value="${esc(search)}" oninput="search=this.value;machinesPage()" placeholder="Buscar máquina ou categoria"></div><div class="summary"><span>Valor total</span><strong>${brl(total)}</strong><small>Comissão 0,7%: ${brl(total*.007)}</small></div></div><div class="table-head"><span>Máquina</span><span>Quantidade</span><span>Valor unitário</span><span>Total</span><span>Status</span><span></span></div>${list.map(m=>`<div class="row"><div class="machine-name"><div class="thumb">□</div><div><strong>${esc(m.name)}</strong><small>${esc(m.category)}</small></div></div><span>${String(m.quantity).padStart(2,'0')}</span><span>${brl(m.price)}</span><strong>${brl(m.quantity*m.price)}</strong><span><i class="pill ${'orange'}">${m.status}</i></span><div class="row-actions"><button onclick="openMachine('${m.id}')">✎</button><button onclick="removeMachine('${m.id}')">×</button></div></div>`).join('')||'<div style="padding:55px;text-align:center;color:#999">Nenhuma máquina encontrada.</div>'}</section>`,'Máquinas')}
function go(v){view=v;search='';render();document.getElementById('side')?.classList.remove('open')}
function render(){if(!session)return login();if(view==='machines')return machinesPage();return overview()}
function toast(msg){const el=document.getElementById('toast');if(!el)return;el.innerHTML=`<div class="toast">${esc(msg)}</div>`;setTimeout(()=>el.innerHTML='',2500)}
function updateApp(){if(document.querySelector('.update-overlay'))return;const el=document.createElement('div');el.className='update-overlay is-loading';el.innerHTML='<div class="update-orb update-spin">↻</div><strong>ATUALIZANDO APP</strong>';document.body.appendChild(el);setTimeout(()=>{el.className='update-overlay is-success';el.innerHTML='<div class="update-orb">✓</div><strong>APLICATIVO ATUALIZADO COM SUCESSO</strong>'},720);setTimeout(()=>{el.remove();view='overview';search='';render();window.location.reload()},1700)}
function logout(){localStorage.removeItem(keySession);session=null;render()}
function openMachine(id){editing=id?machines.find(m=>m.id===id):null;modal='machine';drawModal()}
function openUser(id){if(session.role!=='Administrador')return toast('Apenas administradores podem editar acessos.');editing=id?users.find(u=>u.id===id):null;modal='user';drawModal()}
function closeModal(){modal=null;editing=null;document.querySelector('.modal-bg')?.remove()}
function drawModal(){const m=modal==='machine',x=editing|| (m?{id:'m'+Date.now(),name:'',category:'Motosserras',quantity:1,price:0,status:'Vendido (a)'}:{id:'u'+Date.now(),name:'Novo acesso',email:'',password:'',role:'Operador'});document.body.insertAdjacentHTML('beforeend',`<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modal-head"><div><p class="eyebrow orange">${editing?'EDITAR':'NOVO'} ${m?'ITEM':'ACESSO'}</p><h2>${m?(editing?'Atualizar máquina':'Adicionar máquina'):(editing?'Atualizar credencial':'Criar credencial')}</h2></div><button class="close" onclick="closeModal()">×</button></div><form class="modal-form" id="modalForm">${m?`<label>Nome da máquina<input name="name" value="${esc(x.name)}" placeholder="Ex: Motosserra MS 250" required></label><div class="two"><label>Categoria<select name="category">${['Motosserras','Roçadeiras','Sopradores','Lavadoras','Jardinagem','Acessórios'].map(o=>`<option ${o===x.category?'selected':''}>${o}</option>`).join('')}</select></label><label>Quantidade<input type="number" min="0" name="quantity" value="${x.quantity}"></label></div><div class="two"><label>Valor unitário<input type="number" min="0" step=".01" name="price" value="${x.price}"></label><label>Status<select name="status">${['Vendido (a)'].map(o=>`<option ${o===x.status?'selected':''}>${o}</option>`).join('')}</select></label></div><div class="total"><span>Total automático<br><small>Comissão 0,7%</small></span><strong id="modalTotal">${brl(x.quantity*x.price)}<small>${brl(x.quantity*x.price*.007)}</small></strong></div>`:`<label>Senha autorizada<input autofocus name="password" type="text" value="${esc(x.password)}" placeholder="Cadastre uma senha" required></label><label>Perfil<select name="role"><option ${x.role==='Operador'?'selected':''}>Operador</option><option ${x.role==='Administrador'?'selected':''}>Administrador</option></select></label>`}<div class="modal-actions"><button type="button" class="secondary" onclick="closeModal()">Cancelar</button><button class="primary">${editing?'Salvar alterações':m?'Adicionar ao controle':'Criar acesso'}</button></div></form></div></div>`);const form=document.getElementById('modalForm');if(m){form.price.oninput=form.quantity.oninput=()=>document.getElementById('modalTotal').textContent=brl(Number(form.quantity.value)*Number(form.price.value))}form.onsubmit=e=>{e.preventDefault();const fd=new FormData(form),data=Object.fromEntries(fd);if(m){data.quantity=Number(data.quantity);data.price=Number(data.price);data.id=x.id;machines=editing?machines.map(z=>z.id===x.id?data:z):[data,...machines];save(keyMachines,machines);toast(editing?'Máquina atualizada.':'Máquina adicionada ao estoque.')}else{data.id=x.id;users=editing?users.map(z=>z.id===x.id?data:z):[data,...users];save(keyUsers,users);toast(editing?'Acesso atualizado.':'Novo acesso criado.')}closeModal();render()}}
function removeMachine(id){if(confirm('Remover esta máquina do controle?')){machines=machines.filter(m=>m.id!==id);save(keyMachines,machines);toast('Máquina removida.');render()}}
function removeUser(id){if(id===session.id)return toast('Você não pode remover seu próprio acesso.');if(confirm('Excluir este acesso?')){users=users.filter(u=>u.id!==id);save(keyUsers,users);toast('Acesso excluído.');render()}}
function exportCSV(){const csv=['Máquina,Categoria,Quantidade,Valor unitário,Total,Status',...machines.map(m=>[m.name,m.category,m.quantity,m.price,m.quantity*m.price,m.status].join(','))].join('\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='vetmaq-controle.csv';a.click();toast('Relatório exportado.')}
function exportPDF(){const total=machines.reduce((a,m)=>a+m.quantity*m.price,0),rows=machines.map(m=>`<tr><td>${esc(m.name)}</td><td>${esc(m.category)}</td><td>${m.quantity}</td><td>${brl(m.price)}</td><td>${brl(m.quantity*m.price)}</td></tr>`).join(''),w=open('', '_blank', 'width=900,height=700');if(!w)return toast('Permita pop-ups para exportar o PDF.');w.document.write(`<html><head><title>VetMaq Control — Relatório</title><style>body{font-family:Arial;padding:36px;color:#222}h1{color:#f36b21}table{border-collapse:collapse;width:100%;margin-top:24px}th,td{border:1px solid #ddd;padding:10px;text-align:left}th{background:#fff0e6}.total{margin-top:22px;font-weight:bold}</style></head><body><h1>VETMAQ CONTROL</h1><p>Relatório de máquinas vendidas</p><table><tr><th>Máquina</th><th>Categoria</th><th>Quantidade</th><th>Valor unitário</th><th>Total</th></tr>${rows||'<tr><td colspan="5">Nenhuma máquina cadastrada.</td></tr>'}</table><p class="total">Valor total: ${brl(total)} · Comissão 0,7%: ${brl(total*.007)}</p></body></html>`);w.document.close();w.focus();w.print();toast('Janela de impressão PDF aberta.')}
render();
</script>
